[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "varuna"
version = "0.1.0"
description = "Satellite-powered flood intelligence system for Track B: Mapping Flood Damage from Space"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "VARUNA Scientific Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "rasterio>=1.4.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "networkx>=3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "varuna"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
