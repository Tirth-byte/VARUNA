services:
  - type: web
    name: varuna
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn varuna.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: VARUNA_HOST
        value: 0.0.0.0
      - key: VARUNA_LOG_LEVEL
        value: INFO
